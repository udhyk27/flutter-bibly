name: bibly
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.1+8

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  http: ^1.6.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  webview_flutter: ^4.0.0
  share_plus: ^13.3.0 # 공유
  url_launcher: ^6.3.0
  google_generative_ai: ^0.4.6
  google_fonts: ^8.2.1
  flutter_tts: ^4.0.2

  # 광고
  google_mobile_ads: ^9.1.0

  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1

  # Firebase Core
  firebase_core: ^4.13.0

  # Firebase App Check (앱 무결성 검증)
  firebase_app_check: ^0.4.6

  # Firebase Remote Config
  firebase_remote_config: ^6.5.6

  # Firestore
  cloud_firestore: ^6.8.0

  # Firebase Authentication
  google_sign_in: ^6.2.2
  firebase_auth: ^6.5.7
  firebase_analytics: ^12.4.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

# path_provider_android 2.3.x 는 JNI(libdartjni.so) 기반으로 바뀌어 일부 기기에서
# 로드 실패가 발생한다. 안정적인 마지막 비-JNI 버전으로 고정한다.
dependency_overrides:
  path_provider_android: 2.2.22
flutter:
  uses-material-design: true
  assets:
    - assets/data/daily_verses.json
